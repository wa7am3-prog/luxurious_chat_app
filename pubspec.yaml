name: luxurious_chat_app
description: A luxurious chat and social media app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_animate: ^4.2.0
  google_fonts: ^6.1.0
  provider: ^6.1.1
  record: ^5.1.2         # لتسجيل الصوت
  audioplayers: ^6.0.0   # لتشغيل الصوت والمقاطع المسجلة
  image_picker: ^1.0.7   # لاختيار الصور

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
